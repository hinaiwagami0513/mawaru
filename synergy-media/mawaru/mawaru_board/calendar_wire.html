<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<title>カレンダー — マワル</title>
<link rel="stylesheet" href="./tabler-icons-inline.css">
<link rel="stylesheet" href="./hint.css">
<link rel="stylesheet" href="./brand-ui.css">
<style>
/* このファイルで使うアイコンだけ定義する（フォント実体は tabler-icons-inline.css）。
   字形コードは同梱フォントで実物を描画して確認済み。 */
.ti-plus:before{content:"\eb0b"}
.ti-layout-dashboard:before{content:"\f02c"}
.ti-file-text:before{content:"\eaa2"}
.ti-calendar:before{content:"\ea53"}
.ti-calendar-event:before{content:"\ea52"}
.ti-chart-bar:before{content:"\ea59"}
.ti-folder:before{content:"\eaad"}
.ti-dots:before{content:"\ea95"}
.ti-settings:before{content:"\eb20"}
.ti-chevron-down:before{content:"\ea5f"}
.ti-chevron-left:before{content:"\ea60"}
.ti-chevron-right:before{content:"\ea61"}
.ti-selector:before{content:"\eb1d"}
.ti-coffee:before{content:"\ef0e"}
.ti-sparkles:before{content:"\f6d7"}
.ti-help:before{content:"\eabf"}
.ti-list-check:before{content:"\eb6a"}
.ti-message-dots:before{content:"\eaee"}
.ti-clock:before{content:"\ea70"}
.ti-check:before{content:"\ea5e"}
.ti-x:before{content:"\eb55"}
.ti-arrow-right:before{content:"\ea1f"}
.ti-pencil:before{content:"\eb04"}
.ti-brand-instagram:before{content:"\ec20"}
.ti-brand-x:before{content:"\fc0f"}
.ti-brand-tiktok:before{content:"\ec73"}
.ti-brand-youtube:before{content:"\ec90"}

:root {
  /* 新パレット（藍・水色）由来の追加トークン */
  --color-navy: #122651;
  --color-navy-subtle: #EDF2FA;
  --color-primary-deep: #1B3C7E;
  --color-primary: #2E5AB0;
  --color-primary-hover: #234A96;
  --color-primary-light: #7DABDE;
  --color-primary-subtle: #EDF2FA;
  --color-on-primary: #FFFFFF;
  --color-background: #F2F1F0;
  --color-surface: #FBFAF8;
  --color-card: #FFFFFF;
  --color-foreground: #2A2826;
  --color-muted-foreground: #6E6A66;
  --color-border: #E9E8E6;
  --color-border-strong: #CFCDC9;
  --color-input: #FFFFFF;
  --color-ring: #2E5AB0;
  --color-tertiary: #7DABDE;
  --color-tertiary-subtle: #DCE8F7;
  --color-border-input: #99948C;
  --color-success: #008623; --color-success-vivid: #00A62D;
  --color-success-subtle: #F3FCF6;
  --color-warning: #AB6101;
  --color-warning-border: #FFE6C4;
  --color-warning-subtle: #FFF9F1;
  --color-info: #0B76B2;
  --color-info-subtle: #ECF6FD;
  --color-destructive: #D81028;
  --color-destructive-subtle: #FDEEF0;
  --color-accent-purple: #8B2FB8;
  --color-accent-purple-subtle: #F5E9F9;
  --color-sns-instagram: #B02A78;
  --color-sns-instagram-subtle: #FCE7F3;
  --color-sns-x: #2A2826;
  --color-sns-x-subtle: #F2F1F0;
  --color-sns-tiktok: #0A6F66;
  --color-sns-tiktok-subtle: #E5FBF7;
  --color-sns-youtube: #C4302B;
  --color-sns-youtube-subtle: #FCEBEB;
  --font-body: Inter, "Noto Sans JP";
  --text-h1: 1.875rem;
  --text-h2: 1.25rem;
  --text-h3: 1rem;
  --text-body-lg: 1rem;
  --text-body: 0.875rem;
  --text-label: 0.875rem;
  --text-meta: 0.875rem;
  --font-weight-h1: 700;
  --font-weight-h2: 700;
  --font-weight-h3: 700;
  --font-weight-body: 400;
  --font-weight-body-strong: 700;
  --font-weight-label: 500;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;
  /* セカンダリ＝青系（primary橙＝押せる／secondary青＝情報・補助） */
  --color-secondary: #122651;
  --color-secondary-light: #7DABDE;
  --color-secondary-subtle: #EDF2FA;
  --color-secondary-deep: #0B76B2;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font-body),'Hiragino Sans','Meiryo',sans-serif;-webkit-font-smoothing:antialiased;}
body {background:#F2F1F0;padding:0;color:var(--color-foreground);}
.app{width:100%;background:var(--color-card);border-radius:0;overflow:hidden;display:flex;height:100vh;position:relative;}
.ti{line-height:1;}

/* ===== サイドバー（全画面共通） ===== */
.sb{width:250px;flex:none;background:var(--color-surface);border-right:1px solid var(--color-border);display:flex;flex-direction:column;}
.sbtop{padding:16px 16px 10px;}
.logo{height:24px;margin-bottom:14px;display:block;}
.create{text-decoration:none;width:100%;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--color-primary);color:#fff;border:none;border-radius:var(--radius-md);padding:11px;font-family:inherit;font-size:var(--text-body);font-weight:var(--font-weight-body-strong);cursor:pointer;}
.nav{padding:6px 10px;overflow-y:auto;flex:1;}
.ni{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--radius-md);font-size:var(--text-body-lg);font-weight:var(--font-weight-body-strong);color:var(--color-foreground);cursor:pointer;text-decoration:none;}
.ni .ti{font-size:18px;color:#6E6A66;}
.ni .cv{margin-left:auto;font-size:14px;color:#9a938c;}
.ni.on{background:var(--color-primary-subtle);color:var(--color-primary);font-weight:var(--font-weight-body-strong);}
.ni.on .ti{color:var(--color-primary);}
.nidiv{height:1px;background:var(--color-border);margin:8px 10px;}
/* 中央の投稿作成はSP専用。PCはサイドバー上部の「投稿作成」が同じ役目 */
.ni-create{display:none;}
.ni.exp .cv{transform:rotate(180deg);}
.nisub{display:none;}
.nisub.open{display:block;}
.nis{display:flex;align-items:center;text-decoration:none;padding:8px 10px 8px 41px;border-radius:var(--radius-md);font-size:var(--text-body);font-weight:var(--font-weight-body-strong);color:var(--color-muted-foreground);cursor:pointer;}
.nis:hover{background:var(--color-primary-subtle);color:var(--color-primary);}
.foot{border-top:1px solid var(--color-border);padding:12px;}
.switcher{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--color-border-strong);border-radius:var(--radius-md);background:var(--color-card);cursor:pointer;}
.switcher .pic{width:34px;height:34px;flex:none;border-radius:var(--radius-md);background:#EDF2FA;color:var(--color-primary);display:flex;align-items:center;justify-content:center;font-size:18px;}
.switcher .pn{font-size:var(--text-body);font-weight:var(--font-weight-body-strong);}
.switcher .an{font-size:var(--text-meta);color:#9a938c;}
.switcher .cv{margin-left:auto;color:#9a938c;font-size:17px;}

/* ===== メイン ===== */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.hd{height:64px;flex:none;display:flex;align-items:center;gap:11px;padding:0 26px;border-bottom:1px solid var(--color-border);}
.hd .pgic{font-size:22px;color:var(--color-foreground);}
.hd .pgnm{font-size:var(--text-h3);font-weight:var(--font-weight-body-strong);}
.hd .r{margin-left:auto;display:flex;align-items:center;gap:10px;}
.help{width:38px;height:38px;border:1.5px solid var(--color-primary);color:var(--color-primary);background:transparent;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;text-decoration:none;}
.help:hover{background:var(--color-primary);color:var(--color-on-primary);}
.planchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--color-border-strong);border-radius:var(--radius-full);padding:5px 12px;font-size:var(--text-label);font-weight:var(--font-weight-body-strong);color:var(--color-muted-foreground);white-space:nowrap;}
.planchip i{font-size:15px;color:var(--color-primary);}
.planchip{text-decoration:none;transition:border-color .15s,color .15s;}
.planchip[href]:hover{border-color:var(--color-primary);color:var(--color-foreground);}
.planchip.is-here{cursor:default;}
.hdbtn{position:relative;width:38px;height:38px;flex:none;border:1px solid var(--color-border-strong);background:var(--color-card);color:var(--color-foreground);border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;padding:0;text-decoration:none;}
.hdbtn:hover{border-color:var(--color-primary);color:var(--color-primary);}
.hdbadge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:var(--radius-full);background:var(--color-primary);color:var(--color-on-primary);font-size:var(--text-meta);font-weight:var(--font-weight-body-strong);display:flex;align-items:center;justify-content:center;border:2px solid var(--color-card);}

/* ===== 上のバー ===== */
.tb{flex:none;display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--color-border);}
.navbtn{width:34px;height:34px;border:1px solid var(--color-border-strong);background:var(--color-card);color:var(--color-foreground);border-radius:var(--radius-md);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.navbtn:hover{border-color:var(--color-primary);color:var(--color-primary);}
.btn-today{border:1px solid var(--color-border-strong);background:var(--color-card);color:var(--color-foreground);border-radius:var(--radius-md);padding:0 14px;height:34px;font-family:inherit;font-size:var(--text-label);font-weight:var(--font-weight-body-strong);cursor:pointer;}
.btn-today:hover{border-color:var(--color-primary);color:var(--color-primary);}
.tb .ttl{font-size:var(--text-h2);font-weight:var(--font-weight-h2);margin-left:6px;}
.tb .sp{margin-left:auto;display:flex;align-items:center;gap:12px;}
/* 月・週・日。Googleカレンダーと同じ並びにして、迷わないようにする */
.seg{display:inline-flex;background:var(--color-background);border-radius:var(--radius-md);padding:3px;gap:2px;}
.seg button{border:none;background:transparent;padding:7px 18px;border-radius:var(--radius-sm);font-family:inherit;font-size:var(--text-label);font-weight:var(--font-weight-body-strong);color:var(--color-muted-foreground);cursor:pointer;}
.seg button.on{background:var(--color-card);color:var(--color-primary);box-shadow:0 1px 2px rgba(0,0,0,.08);}
.btn-p{display:inline-flex;align-items:center;gap:7px;background:var(--color-primary);color:var(--color-on-primary);border:none;border-radius:var(--radius-md);padding:0 18px;height:38px;font-family:inherit;font-size:var(--text-body);font-weight:var(--font-weight-body-strong);cursor:pointer;}
.btn-p:hover{background:var(--color-primary-hover);}
.btn-o{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--color-primary);color:var(--color-primary);background:transparent;border-radius:var(--radius-md);padding:0 14px;height:34px;font-family:inherit;font-size:var(--text-label);font-weight:var(--font-weight-body-strong);cursor:pointer;white-space:nowrap;}
.btn-o:hover{background:var(--color-primary);color:var(--color-on-primary);}
.btn-g{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--color-border-strong);color:var(--color-muted-foreground);background:var(--color-card);border-radius:var(--radius-md);padding:0 14px;height:34px;font-family:inherit;font-size:var(--text-label);font-weight:var(--font-weight-label);cursor:pointer;white-space:nowrap;}
.btn-g:hover{border-color:var(--color-foreground);color:var(--color-foreground);}

/* 日にちが決まっていない投稿。カレンダーは「置き場所を決める」画面でもある */

/* ===== 未確定の置き場 =====
   日にちが決まっていない投稿は、カレンダーの外に出しておいて、
   ドラッグで日に置く。「どこに置くか決める」作業がそのまま操作になる。 */
.work{flex:1;min-height:0;display:flex;}
.tray{width:224px;flex:none;border-left:1px solid var(--color-border);background:var(--color-surface);display:flex;flex-direction:column;}
.tray.hide{display:none;}
.tray-h{padding:14px 14px 12px;border-bottom:1px solid var(--color-border);flex:none;display:flex;align-items:center;gap:8px;}
/* 閉じるはSP専用（PCは右の列として常設なので閉じる概念がない） */
.tray-x{display:none;margin-left:auto;width:36px;height:36px;flex:none;border:1px solid var(--color-border);
  background:transparent;border-radius:var(--radius-sm);cursor:pointer;color:var(--color-muted-foreground);
  font-size:18px;align-items:center;justify-content:center;}
.tray-x:hover{background:var(--color-background);color:var(--color-foreground);}
.tray-h .t{display:flex;align-items:center;gap:8px;font-size:var(--text-body);font-weight:var(--font-weight-body-strong);}
.tray-h .cnt{font-size:var(--text-meta);font-weight:var(--font-weight-body-strong);color:var(--color-on-primary);background:var(--color-primary);border-radius:var(--radius-full);padding:2px 8px;}
.tray-b{flex:1;overflow-y:auto;padding:12px;}
.tcard{display:flex;align-items:center;gap:9px;background:var(--color-card);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:9px;margin-bottom:9px;cursor:grab;}
.tcard:hover{border-color:var(--color-primary);}
.tcard:active{cursor:grabbing;}
.tcard.dragging{opacity:.45;}
/* 見分けの手がかりは SNS。色は sns-*-subtle、中にブランドアイコンを置く
   （DESIGN.md: SNSは色だけで区別せず、必ず Tabler ブランドアイコンとセット） */
.tcard .sw,.pop-draft .sw{width:36px;height:36px;flex:none;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:19px;}
.sw.ig{background:var(--color-sns-instagram-subtle);color:var(--color-sns-instagram);}
.sw.x{background:var(--color-sns-x-subtle);color:var(--color-sns-x);}
.sw.tt{background:var(--color-sns-tiktok-subtle);color:var(--color-sns-tiktok);}
.sw.yt{background:var(--color-sns-youtube-subtle);color:var(--color-sns-youtube);}
.tcard .tx{flex:1;min-width:0;}
.tcard .nm{font-size:var(--text-label);font-weight:var(--font-weight-body-strong);line-height:1.5;}
.tcard .mt{font-size:var(--text-meta);color:var(--color-muted-foreground);margin-top:3px;display:flex;align-items:center;gap:4px;}
.tcard .grip{flex:none;color:var(--color-border-strong);font-size:15px;}
.tray-empty{padding:18px 12px;text-align:center;font-size:var(--text-label);color:var(--color-muted-foreground);line-height:1.8;}
/* 置ける場所であることを、掴んでいる間だけ見せる */
.d.over,.w-cell.over,.d-cell.over{background:var(--color-primary-subtle);box-shadow:inset 0 0 0 2px var(--color-primary);}
.traybtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--color-border-strong);background:var(--color-card);color:var(--color-foreground);border-radius:var(--radius-md);padding:0 14px;height:34px;font-family:inherit;font-size:var(--text-label);font-weight:var(--font-weight-body-strong);cursor:pointer;}
.traybtn:hover,.traybtn:hover{border-color:var(--color-primary);color:var(--color-primary);}
.traybtn .n{font-size:var(--text-meta);color:var(--color-on-primary);background:var(--color-primary);border-radius:var(--radius-full);padding:1px 7px;}

/* ===== 中身 ===== */
.cal{flex:1;min-height:0;overflow:auto;background:var(--color-background);}
.view{display:none;}
.view.on{display:block;}

/* --- 月 --- */
.m-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));position:sticky;top:0;background:var(--color-card);z-index:3;border-bottom:1px solid var(--color-border);}
.m-head span{padding:9px 0;text-align:center;font-size:var(--text-label);font-weight:var(--font-weight-body-strong);color:var(--color-muted-foreground);}
.m-head .sun{color:var(--color-destructive);} .m-head .sat{color:var(--color-info);}
.m-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));}
.d{min-width:0;min-height:104px;border-right:1px solid var(--color-border);border-bottom:1px solid var(--color-border);background:var(--color-card);padding:6px;position:relative;cursor:pointer;}
.d:nth-child(7n){border-right:none;}
.d:hover{background:var(--color-surface);}
.d.out{background:var(--color-surface);}
.d.out .dn{color:#CFCDC9;}
.dn{font-size:var(--text-label);font-weight:var(--font-weight-body-strong);text-align:center;padding:2px 0 5px;}
.d.sun .dn{color:var(--color-destructive);} .d.sat .dn{color:var(--color-info);}
.d.today .dn{background:var(--color-primary);color:#fff;border-radius:var(--radius-full);width:24px;height:24px;line-height:24px;margin:0 auto 4px;padding:0;}
/* 空いている日にはホバーで＋を出す。押した日で予約する導線 */
.d .add{position:absolute;top:5px;right:5px;width:20px;height:20px;border:none;background:var(--color-primary-subtle);color:var(--color-primary);border-radius:var(--radius-sm);font-size:14px;cursor:pointer;display:none;align-items:center;justify-content:center;}
.d:hover .add{display:flex;}
/* 予定は掴んで動かせる。掴めることは、指の形（grab）で伝える */
.ev{display:flex;min-width:0;align-items:center;gap:4px;border-radius:var(--radius-sm);padding:3px 6px;margin-bottom:3px;font-size:var(--text-meta);font-weight:var(--font-weight-body-strong);line-height:1.5;cursor:grab;}
.ev:active{cursor:grabbing;}
.ev.dragging{opacity:.45;}
.ev .sw{width:16px;height:16px;flex:none;border-radius:3px;}
.ev i{display:none;}
.ev .tm{font-weight:var(--font-weight-body);opacity:.85;}
.ev .tm{flex:none;}
.ev .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ev.ig{background:var(--color-sns-instagram-subtle);color:var(--color-sns-instagram);}
.ev.x{background:var(--color-sns-x-subtle);color:var(--color-sns-x);}
.ev.tt{background:var(--color-sns-tiktok-subtle);color:var(--color-sns-tiktok);}
.ev.yt{background:var(--color-sns-youtube-subtle);color:var(--color-sns-youtube);}
/* 承認待ちは、出るかどうかまだ決まっていないので枠線で区別する */
.ev.wait{background:var(--color-card);border:1px dashed var(--color-warning-border);color:var(--color-warning);}
.more{font-size:var(--text-meta);color:var(--color-muted-foreground);padding-left:4px;cursor:pointer;}
.more:hover{color:var(--color-primary);text-decoration:underline;}

/* --- 週・日で使う時間の目盛り --- */
.w-head{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));position:sticky;top:0;background:var(--color-card);z-index:3;border-bottom:1px solid var(--color-border);}
.w-head .c{padding:9px 0;text-align:center;}
.w-head .dw{font-size:var(--text-meta);color:var(--color-muted-foreground);font-weight:var(--font-weight-body-strong);}
.w-head .dd{font-size:var(--text-h3);font-weight:var(--font-weight-h3);margin-top:2px;}
.w-head .c.sun .dw,.w-head .c.sun .dd{color:var(--color-destructive);}
.w-head .c.sat .dw,.w-head .c.sat .dd{color:var(--color-info);}
.w-head .c.today .dd{background:var(--color-primary);color:#fff;border-radius:var(--radius-full);width:28px;height:28px;line-height:28px;margin:2px auto 0;}
.w-row{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));}
.w-row .hr{border-right:1px solid var(--color-border);border-bottom:1px solid var(--color-border);background:var(--color-card);font-size:var(--text-meta);color:var(--color-muted-foreground);text-align:right;padding:5px 8px 0 0;}
.w-cell{min-width:0;border-right:1px solid var(--color-border);border-bottom:1px solid var(--color-border);background:var(--color-card);min-height:46px;padding:3px;cursor:pointer;position:relative;}
.w-cell:nth-child(8n+1){border-right:none;}
.w-cell:hover{background:var(--color-primary-subtle);}
/* 反応がよかった時間帯。日付を決める場所なので、ここでも出す */
.w-cell.good{background:#EDF2FA;}
.w-cell.good:after{content:"おすすめ";position:absolute;left:4px;bottom:2px;font-size:9px;color:var(--color-primary);opacity:.75;}
.w-cell.good:hover{background:var(--color-primary-subtle);}

/* --- 日 --- */
.d-wrap{display:grid;grid-template-columns:1fr 300px;gap:0;min-height:100%;}
.d-main{border-right:1px solid var(--color-border);}
.d-row{display:grid;grid-template-columns:64px 1fr;}
.d-row .hr{border-right:1px solid var(--color-border);border-bottom:1px solid var(--color-border);background:var(--color-card);font-size:var(--text-label);color:var(--color-muted-foreground);text-align:right;padding:6px 9px 0 0;}
.d-cell{border-bottom:1px solid var(--color-border);background:var(--color-card);min-height:52px;padding:5px 8px;cursor:pointer;position:relative;}
.d-cell:hover{background:var(--color-primary-subtle);}
.d-cell.good{background:#EDF2FA;}
.d-cell.good:after{content:"よく見られる時間";position:absolute;right:10px;top:8px;font-size:var(--text-meta);color:var(--color-primary);opacity:.8;}
.d-ev{display:flex;align-items:center;gap:9px;border-radius:var(--radius-md);padding:8px 10px;font-size:var(--text-label);font-weight:var(--font-weight-body-strong);cursor:grab;}
.d-ev:active{cursor:grabbing;}
.d-ev.dragging{opacity:.45;}
.d-ev .sw{width:34px;height:34px;flex:none;border-radius:var(--radius-sm);}
.d-side{padding:16px;background:var(--color-surface);}
.d-side .t{font-size:var(--text-body);font-weight:var(--font-weight-body-strong);margin-bottom:4px;}
.d-side .s{font-size:var(--text-meta);color:var(--color-muted-foreground);line-height:1.7;margin-bottom:12px;}
.bt{display:flex;flex-direction:column;gap:2px;padding:11px 13px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-card);margin-bottom:9px;cursor:pointer;}
.bt:hover{border-color:var(--color-primary);}
.bt.best{border-color:var(--color-primary);background:var(--color-primary-subtle);}
.bt .rk{font-size:var(--text-meta);color:var(--color-muted-foreground);font-weight:var(--font-weight-body-strong);}
.bt.best .rk{color:var(--color-primary);}
.bt .wh{font-size:var(--text-body-lg);font-weight:var(--font-weight-h3);}
.bt.best .wh{color:var(--color-primary);}
.bt .rt{font-size:var(--text-meta);color:var(--color-muted-foreground);}

/* 置いたことを短く知らせる */
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%) translateY(12px);display:flex;align-items:center;gap:8px;background:var(--color-foreground);color:#fff;border-radius:var(--radius-full);padding:11px 20px;font-size:var(--text-label);font-weight:var(--font-weight-body-strong);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
.toast i{font-size:16px;color:#00A62D;}

/* ===== 投稿を追加するポップオーバー ===== */
.pop{position:absolute;width:352px;background:var(--color-card);border:1px solid var(--color-border);border-radius:var(--radius-lg);box-shadow:0 12px 32px rgba(0,0,0,.18);z-index:40;display:none;overflow:hidden;}
.pop.on{display:block;}
.pop-h{display:flex;align-items:center;gap:9px;padding:14px 16px;border-bottom:1px solid var(--color-border);background:var(--color-surface);}
.pop-h .t{font-size:var(--text-body-lg);font-weight:var(--font-weight-body-strong);}
.pop-h .x{margin-left:auto;width:28px;height:28px;border:none;background:transparent;color:var(--color-muted-foreground);border-radius:var(--radius-sm);font-size:16px;cursor:pointer;}
.pop-h .x:hover{background:var(--color-border);}
.pop-b{padding:15px 16px 16px;}

/* ===== 日付パネルの「この日の予定」 =====
   カレンダーから既存投稿へ行く唯一の導線。行そのものをリンクにして、
   当たり判定を44px以上取る（40〜50代未経験者向け＝vault: target-first）。 */
.dp-list{display:flex;flex-direction:column;gap:6px;margin-bottom:4px;}
.dp-row{display:flex;align-items:center;gap:9px;min-height:48px;padding:8px 12px;
  border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);
  text-decoration:none;color:var(--color-foreground);}
.dp-row:hover{border-color:var(--color-primary);background:var(--color-primary-subtle);}
/* 行頭のアイコンはSNSごとの色。DESIGN.md「SNSの色は必ずアイコンとセット」に沿う */
.dp-row .dp-ic{flex:none;display:inline-flex;font-size:17px;}
.dp-row.ig .dp-ic{color:var(--color-sns-instagram);}
.dp-row.x  .dp-ic{color:var(--color-sns-x);}
.dp-row.tt .dp-ic{color:var(--color-sns-tiktok);}
.dp-row.yt .dp-ic{color:var(--color-sns-youtube);}
.dp-row.wait .dp-ic{color:var(--color-warning);}
.dp-row .dp-ic i{display:inline-block;}
.dp-tm{flex:none;font-size:var(--text-label);font-weight:var(--font-weight-body-strong);
  font-variant-numeric:tabular-nums;}
.dp-nm{flex:1;min-width:0;font-size:var(--text-label);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dp-go{flex:none;font-size:16px;color:var(--color-muted-foreground);}
/* 「既にある予定」と「新しく入れる」の境目。ここから下は作る操作 */
.dp-sep{height:1px;background:var(--color-border);margin:14px 0;}
.pop-lb{font-size:var(--text-label);font-weight:var(--font-weight-body-strong);margin-bottom:7px;}
.pop-times{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px;}
.tchip{border:1px solid var(--color-border-strong);background:var(--color-card);border-radius:var(--radius-full);padding:7px 13px;font-family:inherit;font-size:var(--text-label);font-weight:var(--font-weight-body-strong);cursor:pointer;color:var(--color-foreground);}
.tchip:hover{border-color:var(--color-primary);color:var(--color-primary);}
.tchip.on{background:var(--color-primary-subtle);border-color:var(--color-primary);color:var(--color-primary);}
.tchip .rec{font-size:var(--text-meta);color:var(--color-primary);font-weight:var(--font-weight-body);margin-left:4px;}
.pop-note{font-size:var(--text-meta);color:var(--color-muted-foreground);line-height:1.7;margin-bottom:14px;}
.pop-sns{display:flex;gap:7px;margin-bottom:15px;}
.snsbtn{width:38px;height:38px;border:1px solid var(--color-border-strong);background:var(--color-card);border-radius:var(--radius-md);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--color-muted-foreground);}
.snsbtn:hover{border-color:var(--color-primary);}
.snsbtn.on{border-color:currentColor;}
.snsbtn.on.ig{background:var(--color-sns-instagram-subtle);color:var(--color-sns-instagram);}
.snsbtn.on.x{background:var(--color-sns-x-subtle);color:var(--color-sns-x);}
.snsbtn.on.tt{background:var(--color-sns-tiktok-subtle);color:var(--color-sns-tiktok);}
.snsbtn.on.yt{background:var(--color-sns-youtube-subtle);color:var(--color-sns-youtube);}
.pop-acts{display:flex;flex-direction:column;gap:9px;}
.pop-acts .btn-p,.pop-acts .btn-g{width:100%;justify-content:center;height:42px;}
.pop-drafts{border-top:1px solid var(--color-border);margin-top:14px;padding-top:13px;}
.pop-draft{display:flex;align-items:center;gap:9px;padding:8px 9px;border:1px solid var(--color-border);border-radius:var(--radius-md);margin-bottom:7px;cursor:pointer;background:var(--color-card);width:100%;font-family:inherit;text-align:left;}
.pop-draft:hover{border-color:var(--color-primary);}
.pop-draft .sw{width:30px;height:30px;flex:none;border-radius:var(--radius-sm);font-size:16px;}
.pop-draft .tx{flex:1;min-width:0;}
.pop-draft .nm{font-size:var(--text-label);font-weight:var(--font-weight-body-strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pop-draft .mt{font-size:var(--text-meta);color:var(--color-muted-foreground);margin-top:2px;}

/* ===== SP調整（この画面固有。シェル共通は shell-sp.css） ===== */
@media (max-width:430px){
  /* カレンダー本体(.cal)と右の未定トレイ(.tray 366px固定)を横に並べているため、
     390pxではカレンダーが24pxまで潰れ、7曜日グリッドの各列が3.4pxになる。縦に積む。 */
  .work{flex-direction:column;}
  /* 未確定トレイは、PCではカレンダーの右に常設される列。
     SPで縦に積むと、カレンダーの遥か下（y=842＝画面外）に置かれる。
     そのため「未確定3」を押しても、既に表示状態のものを隠すだけになり、
     画面上は何も起きないように見えていた（2026-08-28 修正）。
     日付パネルと同じく全画面で開く（DESIGN.md「SP = 全画面遷移」）。
     既定は閉じた状態にして、ボタンで開く。閉じるは .tray-x。 */
  .work .tray{position:fixed;left:0;right:0;top:0;bottom:0;width:auto !important;flex:none;
    border:none;z-index:200;background:var(--color-card);}
  .work .tray .tray-b{flex:1;min-height:0;overflow-y:auto;padding-bottom:24px;}
  .tray-x{display:inline-flex;}
  /* 月グリッドは7曜日のまま。1列に潰すと42行の縦長になる。 */
  .m-grid{grid-template-columns:repeat(7,minmax(0,1fr)) !important;}

  /* 予定バッジ(.ev)がセルからはみ出していた。
     7列なのでセルは 390px で53px、内側に使えるのは41px。
     時刻「08:00」は14px（DESIGN.md の下限）で39px要り、余白を全部削っても
     入るのは390px以上だけ。360pxでは3px、320pxでは8px足りない。

     端末幅で「時刻が出る/出ない」が変わるのは避けたいので、SPの月表示は一律ドットにする。
     月表示は「どの日に投稿があるか」を見る面で、時刻は週/日表示とタップ後の詳細にある。
     ドットはSNSごとの色（.ev.ig / .x / .tt / .yt / .wait）をそのまま持つので、
     どの媒体の予定かは色で読める。 */
  /* 残すのはSNSアイコンだけ。時刻と投稿名は落とす。
     ⚠️ 色だけの丸ポチにはしない。DESIGN.md §Colors は
     「SNS ブランド（バッジ専用。色は必ず Tabler アイコンとセットで使う）」と決めている。
     あの色はアイコンと並ぶ前提の文字色なので、単独のベタ丸にすると濁って見えるし、
     どの媒体かも読み取れない。アイコンなら媒体がそのまま分かる。
     面と色は元のバッジのまま（subtle地＋ブランド色）なので、規則から外れない。 */
  .m-grid .d .ev{padding:2px;gap:0;border-radius:var(--radius-sm);
    display:inline-flex;margin:0 2px 3px 0;line-height:1;}
  .m-grid .d .ev .tm,.m-grid .d .ev .nm{display:none;}
  /* ⚠️ 基底に `.ev i{display:none}` がある（PCは時刻＋投稿名で足りるのでアイコンを消していた）。
     SPは逆にアイコンだけ残す面なので、ここで復活させる。 */
  .m-grid .d .ev .ti{display:inline-block;font-size:14px;}
  .m-grid .d{padding:4px 3px;}

  /* ツールバーは月移動 + 表示切替 + 操作ボタンを1行に並べていて390pxに入らない。
     折り返して2行に積む。 */
  .tb{flex-wrap:wrap;row-gap:8px;}
  .tb .sp{margin-left:0;flex-wrap:wrap;row-gap:8px;}
  .traybtn,.tb .btn-p{white-space:nowrap;}

  /* ここが3段（月移動＋月名／表示切替＋未確定／投稿を作る）で157px使い、
     グリッドが始まるのが画面の1/3の位置になっていた。2段まで削る。

     「投稿を作る」はSPでは外す。この画面には作る入口が3つあった:
       ・右下のFAB       → 作成フローへ直行
       ・日付セルを押す   → その日の日付パネル（正しい日付で開く）
       ・このボタン       → 日付パネル（8月17日で固定。押した日と無関係）
     3つ目は上2つと重複し、しかも日付が固定で誤解を生む。PCには残す。 */
  .tb .btn-p{display:none;}
  /* 余白と表示切替の幅も詰める。ここは移動と切替の帯で、読み物ではない */
  .tb{padding:10px 16px;}
  .tb .seg{padding:2px;}
  .tb .seg>*{padding-left:14px;padding-right:14px;}
}
/* ===== シェル：ヘッダーとサイドバーを角丸のカードにする =====
   全面ベタ（角丸0・隙間0）だと面が窓枠に貼り付いて古く見える。
   .app に余白と gap を持たせて、サイドバー / ヘッダー / 本文を
   生成りの地に浮いた3枚のカードとして置く。 */
.app{background:var(--color-background);padding:10px;gap:10px;}
.sb{border-radius:var(--radius-xl);border-right:none;overflow:hidden;}
.main{gap:10px;}
.hd{border-radius:var(--radius-xl);border-bottom:none;background:var(--color-card);
    box-shadow:var(--shadow-card);padding:0 22px;}
.content{border-radius:var(--radius-xl);background:var(--color-card);
    box-shadow:var(--shadow-card);}
/* トレイは .app の余白ぶん内側に寄せる */
.corner{right:26px;bottom:26px;}

/* ===== サイドバーの文字を白に =====
   地の #2E5AB0 に白は 2.74 で、15px の本文には足りない。
   文字を白にすると決めた以上、地の側を下げてコントラストを作る。
   以前は縦グラデーション（#2E5AB0→#234A96→#234A96）で「上は鮮やかなまま」を
   残していたが、SPではサイドバーが高さ60pxの帯になるため、180度の階調が
   その中に圧縮されて帯状のムラに見え、古く見える原因になっていた（2026-08-28）。
   ベタの primary-deep(#234A96) に統一。白文字で 4.58 なので本文でも AA を満たす。 */
.sb{background:var(--color-primary-deep);}
.sb .logo{opacity:.96;}
.sb .ni{color:rgba(255,255,255,.88);}
.sb .ni .ti{color:rgba(255,255,255,.88);}
/* hover / 選択中は薄い白の面だけで示す（2026-08-21）。縁は付けない。
   面を白に寄せると白文字が沈むので寄せない（白100%なら 1.00、80%でも 1.27）。
   薄いままなら文字は白で通る＝他の行と同じ読みやすさ（オレンジ地に白で 2.7）。
   hover 10% / 選択 22% と差を付けて、面の濃さだけで状態を見分けさせる。 */
.sb .ni:hover{background:rgba(255,255,255,.10);color:#fff;}
.sb .ni:hover .ti{color:#fff;}
/* 選択中は「薄い白」の面に反転させる（2026-08-21）。
   もとは 24%白 + 白文字で、地のオレンジとの差が出ず沈んでいた（白文字は 2.67）。
   ベタ白だと「投稿作成」ボタンと同じ強さになって重いので 80% に落とす。
   ただし 80%白の面（rgb(251,222,209)）に #234A96 は 3.59 で AA に足りないので、
   文字だけ1段濃い #1B3C7E にして 5.47 を確保する。地を薄くしたぶんは文字で補う。 */
.sb .ni.on{background:rgba(255,255,255,.22);color:#fff;}
.sb .ni.on .ti{color:#fff;}
.sb .ni.on .cv{color:#fff;}
/* サブ項目も同じ。.nis.on より .sb .nis が後勝ちして白文字になり、
   薄い地（primary-subtle）と重なって完全に見えなくなっていた。 */
.sb .nis.on{background:rgba(255,255,255,.22);color:#fff;}
.sb .ni .cv{color:rgba(255,255,255,.7);}
.sb .nis{color:rgba(255,255,255,.8);}
.sb .nis:hover{background:rgba(255,255,255,.10);color:#fff;}
.sb .nav,.sb .sbbtm,.sb .foot{border-color:rgba(255,255,255,.22);}
.sb .switcher{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.30);}
.sb .switcher .pn,.sb .switcher .nm{color:#fff;}
.sb .switcher .an,.sb .switcher .cv{color:rgba(255,255,255,.72);}
.sb .switcher .pic{background:#fff;color:#234A96;}
.sb .upg{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.30);}
.sb .upg .ut{color:#fff;}
.sb .upg .ub{background:#fff !important;color:#234A96 !important;}
.sb .upg .ub:hover{filter:brightness(.94);}
.create{background:#fff !important;color:#234A96 !important;}
.create:hover{background:#fff !important;filter:brightness(.96);}

        <div class="d-wrap">
          <div class="d-main" id="dBody"></div>

            <div class="t">よく見られる時間</div>

            <button class="bt best" onclick="openAdd('14:00','8月19日（水）',event)">
              <span class="rk">1位</span><span class="wh">水曜 14:00</span><span class="rt">反応率 8.2%・いちばん見られています</span>
            </button>
            <button class="bt" onclick="openAdd('11:00','8月22日（土）',event)">
              <span class="rk">2位</span><span class="wh">土曜 11:00</span><span class="rt">反応率 7.4%・休日の午前がねらい目</span>
            </button>
            <button class="bt" onclick="openAdd('19:00','8月18日（火）',event)">
              <span class="rk">3位</span><span class="wh">火曜 19:00</span><span class="rt">反応率 6.9%・帰宅後の時間帯</span>

    <!-- 未確定の置き場 -->

        <!-- SPでは全画面で開くので、戻る手段が要る。PCでは非表示（右の列は常設） -->
        <button class="tray-x" onclick="trayToggle()" aria-label="閉じる"><i class="ti ti-x"></i></button>
      </div>
      <div class="tray-b" id="trayBody"></div>

    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- ===== 投稿を追加する ===== -->
  <div class="pop" id="pop">
    <div class="pop-h">
      <i class="ti ti-calendar-event" style="color:var(--color-primary);font-size:18px"></i>
      <span class="t" id="popDate">8月17日（月）</span>
      <button class="x" onclick="closeAdd()" aria-label="閉じる"><i class="ti ti-x"></i></button>
    </div>
    <div class="pop-b" id="popBody">
      <!-- その日にすでに入っている予定。openAdd() が中身を作る。0件の日は空のまま出ない -->
      <div id="popPosts" style="display:none"></div>
      <div class="pop-lb">何時に出しますか</div>
      <div class="pop-times" id="popTimes">
        <button class="tchip on" onclick="pickTime(this)">14:00<span class="rec">おすすめ</span></button>
        <button class="tchip" onclick="pickTime(this)">11:00<span class="rec">おすすめ</span></button>
        <button class="tchip" onclick="pickTime(this)">19:00<span class="rec">おすすめ</span></button>
        <button class="tchip" onclick="pickTime(this)">自分で決める</button>

      <div class="pop-sns">
        <button class="snsbtn ig on" onclick="this.classList.toggle('on')" aria-label="Instagram"><i class="ti ti-brand-instagram"></i></button>
        <button class="snsbtn x" onclick="this.classList.toggle('on')" aria-label="X"><i class="ti ti-brand-x"></i></button>
        <button class="snsbtn tt" onclick="this.classList.toggle('on')" aria-label="TikTok"><i class="ti ti-brand-tiktok"></i></button>
        <button class="snsbtn yt" onclick="this.classList.toggle('on')" aria-label="YouTube"><i class="ti ti-brand-youtube"></i></button>

      <div class="pop-drafts">
        <div class="pop-lb">できている下書きから置く<span style="font-weight:var(--font-weight-body);color:var(--color-muted-foreground)">（<span id="popDraftsN">3</span>件）</span></div>
        <div id="popDrafts"></div>

<script>
// サイドバーの折りたたみ項目
function navToggle(el){
  var sub = el.nextElementSibling;
  if(!sub || !sub.classList.contains('nisub')) return;
  sub.classList.toggle('open');
  el.classList.toggle('exp');
}

/* ===== 予定 =====
   2026年8月。8月16日（日）が今日。ホームの「今週の投稿予定」と同じ中身にしてある。 */
var EVENTS = {
  3:  [{sns:'ig', t:'08:00', n:'朝の店内'}],
  6:  [{sns:'x',  t:'12:00', n:'臨時休業のお知らせ'}],
  10: [{sns:'ig', t:'18:00', n:'看板犬ポチ'}],
  12: [{sns:'x',  t:'12:00', n:'夏休み営業'}],
  13: [{sns:'ig', t:'11:00', n:'新人スタッフ'}, {sns:'tt', t:'19:00', n:'ダックス図鑑'}],
  15: [{sns:'yt', t:'10:00', n:'1日密着'}],
  16: [{sns:'ig', t:'19:00', n:'パフェのお知らせ'}],
  19: [{sns:'ig', t:'14:00', n:'秋メニュー予告'}],
  20: [{sns:'ig', t:'18:00', n:'ドリンク紹介', wait:true}, {sns:'x', t:'20:00', n:'今週のまとめ', wait:true}],
  22: [{sns:'tt', t:'11:00', n:'ポチの散歩'}],
  26: [{sns:'ig', t:'14:00', n:'秋の新作パフェ'}]
};
var SNS_ICON = {ig:'ti-brand-instagram', x:'ti-brand-x', tt:'ti-brand-tiktok', yt:'ti-brand-youtube'};
var WD = ['日','月','火','水','木','金','土'];
var TODAY = 16;

/* 予定ひとつずつに番号をふる。月・週・日は同じ EVENTS を見て描き直すので、
   どのビューで動かしても、ほかのビューに同じ結果が出る。 */
var _eid = 0;
Object.keys(EVENTS).forEach(function(day){
  EVENTS[day].forEach(function(e){ e.id = 'e' + (++_eid); });
});
function newEid(){ return 'e' + (++_eid); }

// 同じ日の中は時間順に並べておく。動かしたあとも並びが崩れない
function sortDay(day){
  if(EVENTS[day]) EVENTS[day].sort(function(a,b){ return a.t.localeCompare(b.t); });
}
function findEvent(id){
  var hit = null;
  Object.keys(EVENTS).forEach(function(day){
    EVENTS[day].forEach(function(e){ if(e.id === id) hit = {ev:e, day:day}; });
  });
  return hit;
}

function evHtml(e){
  return '<div class="ev ' + (e.wait ? 'wait' : e.sns) + '" draggable="true" data-eid="' + e.id + '"' +
         ' ondragstart="dragStartEvent(event)" ondragend="dragEnd(event)"' +
         ' onclick="event.stopPropagation();openDayFromEvent(this)" title="押すとこの日の予定を開きます／ドラッグで日や時間を変えられます">' +
         '<i class="ti ' + SNS_ICON[e.sns] + '"></i>' +
         '<span class="tm">' + e.t + '</span>' +
         '<span class="nm">' + e.n + '</span></div>';
}

/* ===== 月 ===== */
function buildMonth(){
  var html = '';
  // 2026年8月1日は土曜。日曜はじまりの表なので、7月26日から並べる
  for(var i = 26; i <= 31; i++){
    html += '<div class="d out"><div class="dn">' + i + '</div></div>';
  }
  for(var day = 1; day <= 31; day++){
    var wd = (day + 5) % 7;                       // 8/1 が土曜（6）になるよう合わせる
    var cls = 'd' + (wd === 0 ? ' sun' : '') + (wd === 6 ? ' sat' : '') + (day === TODAY ? ' today' : '');
    var evs = EVENTS[day] || [];
    var body = '';
    evs.slice(0,2).forEach(function(e){ body += evHtml(e); });
    if(evs.length > 2) body += '<div class="more">ほか ' + (evs.length - 2) + '件</div>';
    var label = '8月' + day + '日（' + WD[wd] + '）';
    html += '<div class="' + cls + '" data-date="' + label + '" data-day="' + day + '" data-wd="' + wd + '"' +
            ' ondragover="dragOver(event)" ondragleave="dragOut(event)" ondrop="dropOn(event)"' +
            ' onclick="openAdd(null,\'' + label + '\',event)">' +
            '<div class="dn">' + day + '</div>' +
            '<button class="add" aria-label="この日に投稿を置く"><i class="ti ti-plus"></i></button>' +
            body + '</div>';
  }
  for(var j = 1; j <= 5; j++){
    html += '<div class="d out"><div class="dn">' + j + '</div></div>';
  }
  document.getElementById('mGrid').innerHTML = html;
}

/* ===== 週（8月10日〜16日。今日を含む週） ===== */
function buildWeek(){
  var days = [10,11,12,13,14,15,16];
  var head = '<div class="c"></div>';
  days.forEach(function(d, i){
    var cls = 'c' + (i === 6 ? ' sun' : '') + (i === 5 ? ' sat' : '') + (d === TODAY ? ' today' : '');
    head += '<div class="' + cls + '"><div class="dw">' + WD[(d + 5) % 7] + '</div><div class="dd">' + d + '</div></div>';
  });
  document.getElementById('wHead').innerHTML = head;

  var body = '';
  for(var h = 8; h <= 21; h++){
    var hh = (h < 10 ? '0' : '') + h + ':00';
    body += '<div class="w-row"><div class="hr">' + hh + '</div>';
    days.forEach(function(d){
      var wd = (d + 5) % 7;
      // おすすめ枠（水14時 / 土11時 / 火19時）はここでも見えるようにする
      var good = (wd === 3 && h === 14) || (wd === 6 && h === 11) || (wd === 2 && h === 19);
      var evs = (EVENTS[d] || []).filter(function(e){ return parseInt(e.t, 10) === h; });
      var inner = '';
      evs.forEach(function(e){ inner += evHtml(e); });
      var wlabel = '8月' + d + '日（' + WD[wd] + '）';
      body += '<div class="w-cell' + (good ? ' good' : '') + '" data-date="' + wlabel + '" data-day="' + d + '" data-time="' + hh + '"' +
              ' ondragover="dragOver(event)" ondragleave="dragOut(event)" ondrop="dropOn(event)"' +
              ' onclick="openAdd(\'' + hh + '\',\'' + wlabel + '\',event)">' + inner + '</div>';
    });
    body += '</div>';
  }
  document.getElementById('wBody').innerHTML = body;
}

/* ===== 日（8月16日） ===== */
function buildDay(){
  var body = '';
  for(var h = 8; h <= 21; h++){
    var hh = (h < 10 ? '0' : '') + h + ':00';
    // 8月16日は日曜。おすすめ枠（水14 / 土11 / 火19）はこの曜日に無いので、光らせない
    var good = false;
    var evs = (EVENTS[TODAY] || []).filter(function(e){ return parseInt(e.t, 10) === h; });
    var inner = '';
    evs.forEach(function(e){
      var key = ({ig:'instagram',x:'x',tt:'tiktok',yt:'youtube'})[e.sns];
      inner += '<div class="d-ev ' + e.sns + '" draggable="true" data-eid="' + e.id + '"' +
               ' ondragstart="dragStartEvent(event)" ondragend="dragEnd(event)"' +
               ' onclick="event.stopPropagation()" title="ドラッグすると時間を変えられます"' +
               ' style="background:var(--color-sns-' + key + '-subtle);color:var(--color-sns-' + key + ')">' +
               '<span class="sw" style="background:linear-gradient(135deg,#D1CEC8 0%,#BCB8B2 100%)"></span>' +
               '<i class="ti ' + SNS_ICON[e.sns] + '"></i>' + e.t + '　' + e.n + '</div>';
    });
    body += '<div class="d-row"><div class="hr">' + hh + '</div>' +
            '<div class="d-cell' + (good ? ' good' : '') + '" data-date="8月16日（日）" data-day="' + TODAY + '" data-time="' + hh + '"' +
            ' ondragover="dragOver(event)" ondragleave="dragOut(event)" ondrop="dropOn(event)"' +
            ' onclick="openAdd(\'' + hh + '\',\'8月16日（日）\',event)">' + inner + '</div></div>';
  }
  document.getElementById('dBody').innerHTML = body;
}

// 月・週・日は同じ EVENTS から描く。どこかで動かしたら、まとめて描き直す
function renderAll(){ buildMonth(); buildWeek(); buildDay(); }
renderAll();

/* ===== 月・週・日 の切替 ===== */
function calView(v){
  ['month','week','day'].forEach(function(k){
    document.getElementById('view' + k[0].toUpperCase() + k.slice(1)).classList.toggle('on', k === v);
    document.getElementById('seg' + k[0].toUpperCase() + k.slice(1)).classList.toggle('on', k === v);
  });
  document.getElementById('calTtl').textContent =
    v === 'month' ? '2026年8月' :
    v === 'week'  ? '2026年8月10日 〜 16日' : '2026年8月16日（日）';
  document.getElementById('calScroll').scrollTop = 0;
  closeAdd();
}

/* ===== 押した日で予約する =====
   カレンダーから作ると、日時が入った状態で始まる。あとから日を決め直す手間をなくす。 */
/* その日にすでに入っている予定を、パネルの一番上に並べる。
   カレンダーから既存投稿の詳細へ行く導線がどこにも無く、予定バッジを押しても
   stopPropagation で何も起きない死にタップだった（2026-08-28）。
   バッジ(18px)を狙わせるのではなく、セルのどこを押しても開くパネルに一覧を出す。
   ターゲットが40〜50代未経験者（vault: target-first）なので、当たり判定は大きく取る。 */
/* 予定バッジから、その日のパネルを開く。
   ⚠️ バッジのHTMLはJSの ' で囲った文字列の中で組み立てているので、
   onclick に ' を含む式を直接書くと文字列が途中で閉じてカレンダーごと描画されなくなる。
   引用符を持ち込まないよう、この関数に逃がす。 */
function openDayFromEvent(el){
  var cell = el.closest('.d');
  if(!cell) return;
  /* openAdd は先頭で ev.stopPropagation() を呼ぶので、空実装を持たせて渡す */
  openAdd(null, cell.dataset.date, { currentTarget: cell, stopPropagation: function(){} });
}

function renderDayPosts(cell){
  var box = document.getElementById('popPosts');
  if(!box) return;
  var evs = cell ? [].slice.call(cell.querySelectorAll('.ev')) : [];
  if(!evs.length){ box.innerHTML = ''; box.style.display = 'none'; return; }
  box.style.display = '';
  var rows = evs.map(function(e){
    var icon = e.querySelector('.ti');
    var tm = e.querySelector('.tm');
    var nm = e.querySelector('.nm');
    /* SNSの色はバッジのクラス(.ig/.x/.tt/.yt)がそのまま持っている。
       DESIGN.md の「SNSの色はアイコンとセット」に従い、行頭は色つきアイコンで示す。 */
    /* 一覧ではなく、その投稿の詳細を開いた状態へ送る（?post= で投稿名を渡す） */
    var name = nm ? nm.textContent.trim() : '';
    return '<a class="dp-row ' + e.className.replace('ev', '').trim() + '"'
      + ' href="./post_list_wire.html?post=' + encodeURIComponent(name) + '">'
      + '<span class="dp-ic">' + (icon ? icon.outerHTML : '') + '</span>'
      + '<span class="dp-tm">' + (tm ? tm.textContent : '') + '</span>'
      + '<span class="dp-nm">' + (nm ? nm.textContent : '（無題）') + '</span>'
      + '<i class="ti ti-chevron-right dp-go"></i></a>';
  }).join('');
  box.innerHTML = '<div class="pop-lb">この日の予定（' + evs.length + '件）</div>'
    + '<div class="dp-list">' + rows + '</div><div class="dp-sep"></div>';
}

function openAdd(time, dateLabel, ev){
  if(ev) ev.stopPropagation();
  var pop = document.getElementById('pop');
  document.getElementById('popDate').textContent = dateLabel;
  /* 押されたセル（バッジから来たときは、その親のセル）の予定を出す */
  var cell = null;
  if(ev && ev.currentTarget) cell = ev.currentTarget.closest ? ev.currentTarget.closest('.d') : null;
  if(!cell && ev && ev.target && ev.target.closest) cell = ev.target.closest('.d');
  renderDayPosts(cell);
  // 時間が決まっている枠から開いたときは、その時間を選んだ状態にする
  var chips = document.querySelectorAll('#popTimes .tchip');
  chips.forEach(function(c){ c.classList.remove('on'); });
  if(time){
    var hit = [].slice.call(chips).filter(function(c){ return c.textContent.indexOf(time) === 0; })[0];
    (hit || chips[chips.length - 1]).classList.add('on');
  } else {
    chips[0].classList.add('on');
  }
  // 押した場所の近くに出す。画面からはみ出さないように寄せる
  pop.classList.add('on');
  var app = document.querySelector('.app').getBoundingClientRect();
  // マウスの位置を使う。キーボード操作など座標が無いときは、押した枠の位置から出す。
  var x, y;
  if(ev && ev.clientX){
    x = ev.clientX - app.left + 10;
    y = ev.clientY - app.top + 10;
  } else if(ev && ev.currentTarget && ev.currentTarget.getBoundingClientRect){
    var r = ev.currentTarget.getBoundingClientRect();
    x = r.left - app.left + r.width / 2 - 176;
    y = r.bottom - app.top + 6;
  } else {
    x = app.width / 2 - 176;
    y = 120;
  }
  /* SPは全画面で開く（shell-sp.css）。押した場所に合わせて置く必要が無いうえ、
     ここでインラインの left/top を書くとCSSより強く効いて、全画面指定が壊れる。
     ⚠️ 前に開いたときのインライン値が残るので、消してから返す。 */
  if (matchMedia('(max-width:430px)').matches) {
    pop.style.left = '';
    pop.style.top = '';
    return;
  }
  pop.style.left = Math.max(12, Math.min(x, app.width - 364)) + 'px';
  pop.style.top  = Math.max(12, Math.min(y, app.height - pop.offsetHeight - 12)) + 'px';
}
function closeAdd(){ document.getElementById('pop').classList.remove('on'); }
function pickTime(el){
  el.parentElement.querySelectorAll('.tchip').forEach(function(c){ c.classList.remove('on'); });
  el.classList.add('on');
}
function chosen(){
  var d = document.getElementById('popDate').textContent;
  var t = document.querySelector('#popTimes .tchip.on');
  return d + ' ' + (t ? t.textContent.replace('おすすめ','') : '');
}
// 新しく作る → 日時が入った状態で投稿作成へ
function placeNew(){
  location.href = './flow_image_material_wire.html';
}

/* ===== 未確定の投稿 =====
   置き場（右）とポップオーバーの一覧は同じものを見ている。片方で置けば両方から消える。 */
var DRAFTS = [
  {id:'d1', nm:'秋の新作パフェのお知らせ', sns:'ig'},
  {id:'d2', nm:'ポチのお散歩コース紹介',   sns:'tt'},
  {id:'d3', nm:'テラス席のご案内',         sns:'ig'}
];
var SNS_NAME = {ig:'Instagram', x:'X', tt:'TikTok', yt:'YouTube'};

function renderDrafts(){
  var tray = document.getElementById('trayBody');
  tray.innerHTML = DRAFTS.length
    ? DRAFTS.map(function(d){
        return '<div class="tcard" draggable="true" data-id="' + d.id + '"' +
               ' ondragstart="dragStart(event)" ondragend="dragEnd(event)">' +
               '<span class="sw ' + d.sns + '"><i class="ti ' + SNS_ICON[d.sns] + '"></i></span>' +
               '<div class="tx"><div class="nm">' + d.nm + '</div>' +
               '<div class="mt"><i class="ti ' + SNS_ICON[d.sns] + '"></i>' + SNS_NAME[d.sns] + '・下書き</div></div>' +
               '<i class="ti ti-dots-vertical grip"></i></div>';
      }).join('')
    : '<div class="tray-empty">未確定の投稿はありません。<br>すべて日にちが決まっています。</div>';
  document.getElementById('trayCnt').textContent = DRAFTS.length;
  document.getElementById('trayN').textContent = DRAFTS.length;
  // ポップオーバーの一覧も同じ中身にする
  var pd = document.getElementById('popDrafts');
  if(pd){
    document.getElementById('popDraftsN').textContent = DRAFTS.length;
    pd.innerHTML = DRAFTS.map(function(d){
      return '<button class="pop-draft" onclick="placeFromPop(\'' + d.id + '\')">' +
             '<span class="sw ' + d.sns + '"><i class="ti ' + SNS_ICON[d.sns] + '"></i></span>' +
             '<div class="tx"><div class="nm">' + d.nm + '</div>' +
             '<div class="mt">' + SNS_NAME[d.sns] + '・下書き</div></div></button>';
    }).join('') || '<div class="tray-empty" style="padding:10px 0">未確定の投稿はありません。</div>';
  }
}

/* --- ドラッグ ---
   掴めるものは2種類ある。未確定の下書き（右の置き場）と、もう置いてある予定。
   落とし先はどちらも同じ枠なので、何を掴んだかを頭に付けて渡す。 */
function dragStart(e){
  e.dataTransfer.setData('text/plain', 'draft:' + e.currentTarget.dataset.id);
  e.dataTransfer.effectAllowed = 'move';
  e.currentTarget.classList.add('dragging');
}
function dragStartEvent(e){
  e.stopPropagation();
  e.dataTransfer.setData('text/plain', 'event:' + e.currentTarget.dataset.eid);
  e.dataTransfer.effectAllowed = 'move';
  e.currentTarget.classList.add('dragging');
}
function dragEnd(e){ e.currentTarget.classList.remove('dragging'); }
function dragOver(e){ e.preventDefault(); e.dataTransfer.dropEffect = 'move'; e.currentTarget.classList.add('over'); }
function dragOut(e){ e.currentTarget.classList.remove('over'); }

// 月の枠に落としたときは時間が決まっていないので、その曜日のおすすめ時間を入れる
var REC_BY_WD = {3:'14:00', 6:'11:00', 2:'19:00'};
function dropOn(e){
  e.preventDefault();
  var cell = e.currentTarget;
  cell.classList.remove('over');
  var raw = e.dataTransfer.getData('text/plain') || '';
  var sep = raw.indexOf(':');
  var kind = sep < 0 ? 'draft' : raw.slice(0, sep);
  var id = sep < 0 ? raw : raw.slice(sep + 1);
  var day = parseInt(cell.dataset.day, 10);
  if(!day) return;

  if(kind === 'event'){
    // 週・日の枠に落とせば時間も変わる。月の枠は時間の目盛りがないので、時間はそのまま
    moveEvent(id, day, cell.dataset.time || null, cell.dataset.date);
    return;
  }
  var d = DRAFTS.filter(function(x){ return x.id === id; })[0];
  if(!d) return;
  var time = cell.dataset.time || REC_BY_WD[cell.dataset.wd] || '19:00';
  place(d, day, cell.dataset.date, time);
}

// 動かす：日と時間を書き換えて、全部のビューを描き直す
function moveEvent(id, day, time, dateLabel){
  var hit = findEvent(id);
  if(!hit) return;
  var from = hit.day;
  if(time) hit.ev.t = time;
  if(String(from) !== String(day)){
    EVENTS[from] = EVENTS[from].filter(function(x){ return x.id !== id; });
    if(!EVENTS[day]) EVENTS[day] = [];
    EVENTS[day].push(hit.ev);
    sortDay(from);
  }
  sortDay(day);
  renderAll();
  toast(dateLabel + ' ' + hit.ev.t + ' に移しました');
}

// 置く：カレンダーに出して、未確定から外す
function place(d, day, dateLabel, time){
  DRAFTS = DRAFTS.filter(function(x){ return x.id !== d.id; });
  if(day){
    if(!EVENTS[day]) EVENTS[day] = [];
    EVENTS[day].push({sns:d.sns, t:time, n:d.nm, id:newEid()});
    sortDay(day);
    renderAll();
  }
  renderDrafts();
  toast(dateLabel + ' ' + time + ' に予約しました');
}

// ポップオーバーの一覧から置いたときは、その日の枠を探して出す
function placeFromPop(id){
  var d = DRAFTS.filter(function(x){ return x.id === id; })[0];
  if(!d) return;
  var dateLabel = document.getElementById('popDate').textContent;
  var t = document.querySelector('#popTimes .tchip.on');
  var time = t ? t.textContent.replace('おすすめ','').trim() : '19:00';
  if(time === '自分で決める') time = '19:00';
  var cell = document.querySelector('.d[data-date="' + dateLabel + '"]');
  place(d, cell ? parseInt(cell.dataset.day, 10) : 0, dateLabel, time);
  document.getElementById('popBody').innerHTML =
    '<div class="hint ok"><span class="info-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="7.6" r="1.1" fill="currentColor" stroke="none"/></svg></span><div><span class="lb">DONE</span><b>' + dateLabel + ' ' + time + '</b> に予約しました。<br>' +
    'この時間になると、自動でSNSに出ます。取り消したいときは、投稿を押して「予約を取り消す」を選んでください。</div></div>' +
    '<div class="pop-acts" style="margin-top:13px"><button class="btn-g" onclick="closeAdd()">閉じる</button></div>';
}

// 置いたことを短く知らせる
function toast(msg){
  var t = document.getElementById('toast');
  t.innerHTML = '<i class="ti ti-check"></i>' + msg;
  t.classList.add('on');
  clearTimeout(t._t);
  t._t = setTimeout(function(){ t.classList.remove('on'); }, 2600);
}

function trayToggle(){ document.getElementById('tray').classList.toggle('hide'); }

/* SPではトレイを全画面で開く（shell側CSS）。開きっぱなしで始まるとカレンダーが
   隠れてしまうので、最初は閉じておく。PCは右の列として常設なので触らない。
   ⚠️ 一度でも自分で開閉したら、リサイズで勝手に閉じ直さない。 */
(function(){
  var tray = document.getElementById('tray');
  if(!tray) return;
  var touched = false;
  document.querySelectorAll('.traybtn,.tray-x').forEach(function(b){
    b.addEventListener('click', function(){ touched = true; });
  });
  function sync(){
    if(touched) return;
    tray.classList.toggle('hide', matchMedia('(max-width:430px)').matches);
  }
  sync();
  addEventListener('resize', sync);
})();
renderDrafts();

// 外側を押したら閉じる
document.addEventListener('click', function(e){
  var pop = document.getElementById('pop');
  if(pop.classList.contains('on') && !pop.contains(e.target)) closeAdd();
});
