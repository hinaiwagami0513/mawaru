<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="ひとつの投稿が、もう一方のSNSへ自動でコピーされる図">
  <!-- TIPS「Instagram投稿をFacebookにも自動連携」用サムネイル。
       マワルのトークン配色（cream #FDF6EE / orange #EF6108 / blue #185FA5 / charcoal #2A2826）。 -->
  <rect width="320" height="180" fill="#FDF6EE"/>

  <!-- 左：投稿元のSNSカード -->
  <rect x="34" y="52" width="86" height="96" rx="12" fill="#FFFFFF" stroke="#2A2826" stroke-width="2.5"/>
  <rect x="46" y="64" width="62" height="40" rx="7" fill="#185FA5"/>
  <circle cx="62" cy="79" r="6" fill="#FDF6EE"/>
  <path d="M50 100 L67 82 L80 95 L90 87 L104 100 Z" fill="#0F4C81"/>
  <rect x="46" y="112" width="62" height="6" rx="3" fill="#E0DCD6"/>
  <rect x="46" y="124" width="42" height="6" rx="3" fill="#E0DCD6"/>

  <!-- 右：自動でコピーされる先のSNSカード -->
  <rect x="200" y="52" width="86" height="96" rx="12" fill="#FFFFFF" stroke="#2A2826" stroke-width="2.5"/>
  <rect x="212" y="64" width="62" height="40" rx="7" fill="#185FA5"/>
  <circle cx="228" cy="79" r="6" fill="#FDF6EE"/>
  <path d="M216 100 L233 82 L246 95 L256 87 L270 100 Z" fill="#0F4C81"/>
  <rect x="212" y="112" width="62" height="6" rx="3" fill="#E0DCD6"/>
  <rect x="212" y="124" width="42" height="6" rx="3" fill="#E0DCD6"/>

  <!-- 上をまたぐ自動コピーの矢印 -->
  <path d="M104 46 C 132 14, 188 14, 216 46" fill="none" stroke="#EF6108" stroke-width="4" stroke-linecap="round"/>
  <path d="M216 46 L205 38 L214 33 Z" fill="#EF6108"/>

  <!-- 矢印の途中を流れていく1枚の投稿 -->
  <rect x="146" y="10" width="30" height="30" rx="7" fill="#EF6108" stroke="#FDF6EE" stroke-width="3"/>
  <circle cx="155" cy="20" r="3.5" fill="#FDF6EE"/>
  <path d="M149 33 L158 24 L165 30 L171 26 L174 33 Z" fill="#FDF6EE"/>
</svg>
