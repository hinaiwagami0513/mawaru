<!--
  初心者マーク（若葉マーク / shoshinsha mark）

  出典: Google Noto Emoji (U+1F530) — https://github.com/googlefonts/noto-emoji
  ライセンス: Apache License 2.0（継承義務なし。改変可）

  改変点: フラットなUIに合わせて、白い光沢の3レイヤー（opacity 0.3〜0.6 の
  path 2本と circle 1個）を取り除いた。17px で出すと光沢がノイズになるため。
  形と2色はそのまま。手で描き起こすと標章として似て非なるものになるので触らない。

  公式の色は 黄 #f4ed19 / ティール #22aa98（法令の標識）。Noto の #FCE438 / #26A69A は
  これに最も近く、かつ再配布できるライセンスのものだったため採用した。
-->
