<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="投稿文の書類に虫めがねが重なり、チェックの印が付いている図">
  <!-- TIPS「AIレビューの指摘、どこまで直せばいい？」用サムネイル。 -->
  <rect width="320" height="180" fill="#FDF6EE"/>

  <!-- 後ろにずらして重ねた紙 -->
  <rect x="86" y="26" width="112" height="132" rx="11" fill="#F5EFE6" stroke="#2A2826" stroke-width="2.5"/>

  <!-- 手前の投稿文 -->
  <rect x="70" y="18" width="112" height="132" rx="11" fill="#FFFFFF" stroke="#2A2826" stroke-width="2.5"/>
  <rect x="86" y="36" width="60" height="8" rx="4" fill="#2A2826"/>
  <rect x="86" y="56" width="80" height="6" rx="3" fill="#E0DCD6"/>
  <rect x="86" y="70" width="72" height="6" rx="3" fill="#E0DCD6"/>
  <!-- 指摘が当たっている一行だけ色を変える -->
  <rect x="86" y="84" width="66" height="6" rx="3" fill="#9C6BD8"/>
  <rect x="86" y="98" width="80" height="6" rx="3" fill="#E0DCD6"/>
  <rect x="86" y="112" width="44" height="6" rx="3" fill="#E0DCD6"/>

  <!-- 虫めがね -->
  <circle cx="196" cy="104" r="34" fill="#FFFFFF" fill-opacity="0.55" stroke="#185FA5" stroke-width="5"/>
  <path d="M220 128 L244 152" stroke="#185FA5" stroke-width="8" stroke-linecap="round"/>

  <!-- チェックのバッジ -->
  <circle cx="228" cy="44" r="18" fill="#12960A"/>
  <path d="M220 44 L226 50 L237 38" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="266" cy="82" r="12" fill="#EF6108"/>
  <path d="M261 82 L265 86 L272 77" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
