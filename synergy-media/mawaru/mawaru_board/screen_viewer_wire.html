<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>マワル 画面ビューア</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./tabler-icons-inline.css">
<style>
/* アイコン定義の不足ぶん */
.ti-search:before{content:"\eb1c"}
.ti-device-laptop:before{content:"\eb64"}
.ti-device-mobile:before{content:"\ea8a"}
.ti-arrow-up-right:before{content:"\ea24"}
.ti-arrow-left:before{content:"\ea19"}
.ti-layout-grid:before{content:"\edba"}
:root{
  /* 新パレット（藍・水色）由来の追加トークン */
  --color-navy: #122651;
  --color-navy-subtle: #EDF2FA;
  --color-primary-deep: #1B3C7E;
  --color-primary:#2E5AB0; --color-primary-hover:#234A96; --color-primary-subtle:#EDF2FA;
  --color-background:#F2F1F0; --color-surface:#FBFAF8; --color-card:#FFFFFF;
  --color-foreground:#2A2826; --color-muted-foreground:#6E6A66;
  --color-border:#E9E8E6; --color-border-strong:#CFCDC9; --color-input:#FFFFFF;
  --text-h3:1rem; --text-body:0.875rem; --text-label:0.875rem; --text-meta:0.875rem;
  --font-weight-body-strong:700;
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px; --radius-full:999px;
  /* セカンダリ＝青系（primary橙＝押せる／secondary青＝情報・補助） */
  --color-secondary: #122651;
  --color-secondary-light: #7DABDE;
  --color-secondary-subtle: #EDF2FA;
  --color-secondary-deep: #0B76B2;
}
*{box-sizing:border-box;}
body {margin:0;font-family:Inter, 'Noto Sans JP', 'Hiragino Sans', 'Meiryo', sans-serif;background:var(--color-background);color:var(--color-foreground);
  height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* ===== 上部バー ===== */
.vtop{flex:none;display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--color-card);
  border-bottom:1px solid var(--color-border);}
.vtitle{font-size:var(--text-h3);font-weight:900;}
.vback{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--radius-md);
  border:1px solid var(--color-border);background:transparent;color:var(--color-foreground);text-decoration:none;
  font-size:var(--text-label);font-weight:var(--font-weight-body-strong);}
.vback:hover{border-color:var(--color-primary);color:var(--color-primary);background:var(--color-primary-subtle);}
.vsearch{position:relative;margin-left:8px;}
.vsearch input{width:300px;height:36px;padding:0 12px 0 32px;border-radius:var(--radius-full);
  border:1px solid var(--color-border);background:var(--color-surface);font-family:inherit;
  font-size:var(--text-label);color:var(--color-foreground);outline:none;}
.vsearch input:focus{border-color:var(--color-primary);background:var(--color-card);}
.vsearch i{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--color-muted-foreground);}
.vspacer{margin-left:auto;}
.vseg{display:inline-flex;background:var(--color-background);border-radius:var(--radius-full);padding:3px;gap:2px;}
.vseg button{border:none;background:transparent;padding:6px 13px;border-radius:var(--radius-full);font-family:inherit;
  font-size:var(--text-label);font-weight:var(--font-weight-body-strong);color:var(--color-muted-foreground);
  cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
.vseg button.on{background:var(--color-card);color:var(--color-primary);box-shadow:0 1px 2px rgba(0,0,0,.08);}
.vopen{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-md);border:none;
  background:var(--color-primary);color:#fff;text-decoration:none;font-size:var(--text-label);
  font-weight:var(--font-weight-body-strong);}
.vopen:hover{background:var(--color-primary-hover);}

/* ===== 本体：左リスト＋右プレビュー ===== */
.vmain{flex:1;display:flex;min-height:0;}
.vside{width:280px;flex:none;background:var(--color-card);border-right:1px solid var(--color-border);
  overflow-y:auto;padding:10px 10px 24px;}
.vgroup{margin-top:12px;}
.vgroup:first-child{margin-top:2px;}
.vgname{font-size:var(--text-meta);font-weight:var(--font-weight-body-strong);color:var(--color-muted-foreground);
  padding:6px 10px;letter-spacing:.02em;}
.vitem{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-md);cursor:pointer;
  font-size:var(--text-label);line-height:1.5;}
.vitem:hover{background:var(--color-background);}
.vitem.on{background:var(--color-primary-subtle);color:var(--color-primary);font-weight:var(--font-weight-body-strong);}
.vitem .vt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.vitem .vstep{font-size:14px;font-weight:var(--font-weight-body-strong);color:var(--color-muted-foreground);
  background:var(--color-background);border-radius:var(--radius-full);padding:2px 7px;flex:none;}
.vitem.on .vstep{background:var(--color-card);color:var(--color-primary);}
.vempty{padding:16px 12px;font-size:var(--text-label);color:var(--color-muted-foreground);text-align:center;}

.vstage{flex:1;min-width:0;background:var(--color-background);overflow:auto;padding:22px;display:flex;justify-content:center;align-items:flex-start;}
.vfit{position:relative;flex:none;}
.vframe{position:absolute;top:0;left:0;background:var(--color-card);border:1px solid var(--color-border);
  border-radius:var(--radius-lg);box-shadow:0 6px 24px rgba(0,0,0,.08);overflow:hidden;transform-origin:top left;}
.vframe iframe{display:block;border:0;background:var(--color-card);}
.vhint{position:fixed;right:22px;bottom:18px;font-size:var(--text-meta);color:var(--color-muted-foreground);
  background:var(--color-card);border:1px solid var(--color-border);border-radius:var(--radius-full);padding:6px 12px;}

/* ===== SP対応 =====
   .vtop は戻る/検索/S・M・L/PC・SP/新タブ を1行に並べていて 773px あるため、
   390pxでは右半分が画面外に出る。折り返して2〜3行に積む。 */
@media (max-width:430px){
  .vtop{flex-wrap:wrap;row-gap:8px;padding:10px 14px;}
  .vtitle{font-size:var(--text-body);white-space:nowrap;}
  /* 検索は幅を取りすぎるので、行いっぱいに使わせて他を次の行へ落とす */
  .vsearch{margin-left:0;flex-basis:100%;}
  .vsearch input{width:100% !important;}
  /* 右寄せをやめる。左から詰めて折り返す */
  .vspacer{margin-left:0;}
  .vseg{flex:none;}
  .vopen{flex:none;}
  .vmain{flex-direction:column;}
}
</style></head>
<body>

<div class="vtop">
  <a class="vback" href="./board.html"><i class="ti ti-arrow-left"></i>ボード</a>
  <span class="vtitle">画面ビューア</span>
  <div class="vsearch"><i class="ti ti-search"></i>
    <input id="vq" type="text" placeholder="画面をさがす（/ でフォーカス）" autocomplete="off"></div>
  <div class="vspacer"></div>
  <div class="vseg" id="vDevice">
    <button data-d="pc" class="on"><i class="ti ti-device-laptop"></i>PC</button>
    <button data-d="sp"><i class="ti ti-device-mobile"></i>SP</button>
  </div>
  <div class="vseg" id="vZoom">
    <button data-z="fit" class="on">フィット</button>
    <button data-z="100">100%</button>
  </div>
  <a class="vopen" id="vOpen" href="#" target="_blank" rel="noopener"><i class="ti ti-arrow-up-right"></i>新タブで開く</a>
</div>

<div class="vmain">
  <div class="vside" id="vSide"></div>
  <div class="vstage" id="vStage">
    <div class="vfit" id="vFit"><div class="vframe" id="vFrame"><iframe id="vIframe" title="画面プレビュー"></iframe></div></div>
  </div>
</div>
<div class="vhint">↑ ↓ で画面を移動／Enter で開く</div>

<script>
/* 画面の一覧。ボードのカードに加えて、途中の画面（#step=…）も直接ひらける */
var SCREENS=[
 {g:'ホーム', t:'ホーム', h:'./shell_header_sidebar_wire.html', w:1300},
 {g:'その他', t:'NEWS', h:'./news_wire.html', w:1300},
 {g:'その他', t:'広告（一覧）', h:'./ads_wire.html', w:1240},
 {g:'その他', t:'発注相談', h:'./request_wire.html#order', w:1240},
 {g:'その他', t:'出張撮影', h:'./request_wire.html#shoot', w:1240},
 {g:'カレンダー', t:'カレンダー（月）', h:'./calendar_wire.html', w:1240},
 {g:'ドライブ', t:'マワルドライブ（素材）', h:'./drive_wire.html', w:1240},
 {g:'チャット', t:'チャット', h:'./chat_wire.html', w:1240},
 {g:'設定', t:'運用目的', h:'./settings_wire.html#project', w:1240},
 {g:'設定', t:'料金一覧', h:'./plan_wire.html', w:1240},
 {g:'設定', t:'SNS設定', h:'./settings_wire.html#sns', w:1240},
 {g:'設定', t:'AIレビュー', h:'./settings_wire.html#review', w:1240},
 {g:'設定', t:'メンバー管理', h:'./settings_wire.html#members', w:1240},
 {g:'ドライブ', t:'マワルドライブ（資料・URLで絞った状態）', h:'./drive_wire.html#learn', w:1240},
 {g:'投稿一覧', t:'下書き', h:'./post_list_wire.html#draft', w:1280},
 {g:'投稿一覧', t:'予約済み', h:'./post_list_wire.html#ready', w:1280},
 {g:'投稿一覧', t:'投稿済み', h:'./post_list_wire.html#posted', w:1280},
 {g:'承認フロー', t:'投稿一覧ロール別', h:'./approval_list_wire.html', w:1280},
 {g:'承認フロー', t:'下書き（一人運用・承認者なし）', h:'./post_list_wire.html#draft-solo', w:1280},
 {g:'分析', t:'ビジュアルレポート', h:'./analysis_visual_wire.html', w:1120},
 {g:'分析', t:'アカウントレポート > 数値変化', h:'./analysis_metrics_wire.html', w:1120},
 {g:'分析', t:'アカウントレポート > AIレポート', h:'./analysis_report_wire.html', w:1120},
 {g:'分析', t:'アカウントレポート > アカウント推移', h:'./analysis_account_wire.html', w:1120},
 {g:'分析', t:'投稿レポート', h:'./analysis_posts_wire.html', w:1120},
 {g:'動画作成フロー', t:'動画台本ルート（最初から）', h:'./flow_video_script_wire.html', w:1120},
 {g:'動画作成フロー', t:'投稿するアカウントを選択', h:'./flow_video_script_wire.html#step=sns', w:1120, s:'途中'},
 {g:'動画作成フロー', t:'企画を考える（チャット）', h:'./flow_video_script_wire.html#step=base', w:1120, s:'途中'},
 {g:'動画作成フロー', t:'この案で作りますか？（まとめて作る）', h:'./flow_video_script_wire.html#step=bulkcheck', w:1120, s:'途中'},
 {g:'動画作成フロー', t:'投稿を編集（動画）', h:'./flow_video_script_wire.html#step=editor', w:1200, s:'途中'},
 {g:'動画作成フロー', t:'動画素材ルート（最初から）', h:'./flow_video_material_wire.html', w:1120},
 {g:'動画作成フロー', t:'素材をアップ', h:'./flow_video_material_wire.html#step=upload', w:1280, s:'途中'},
 {g:'動画作成フロー', t:'チャットで台本と設定を決める', h:'./flow_video_material_wire.html#step=chat', w:1280, s:'途中'},
 {g:'動画作成フロー', t:'確認依頼（動画）', h:'./flow_video_script_wire.html#approval-request', w:1200, s:'途中'},
 {g:'動画作成フロー', t:'確認待ち - 作成者視点（動画）', h:'./flow_video_script_wire.html#approval-waiting', w:1200, s:'途中'},
 {g:'動画作成フロー', t:'承認者確認中（動画）', h:'./flow_video_script_wire.html#approval-review', w:1200, s:'途中'},
 {g:'動画作成フロー', t:'承認済み（動画）', h:'./flow_video_script_wire.html#approval-approved', w:1200, s:'途中'},
 {g:'動画作成フロー', t:'動画エディタ', h:'./video_editor_dark_wire.html', w:1440},
 {g:'画像作成フロー', t:'画像台本ルート（最初から）', h:'./flow_image_v3_wire.html', w:1120},
 {g:'画像作成フロー', t:'企画を考える（チャット）', h:'./flow_image_v3_wire.html#step=base', w:1120, s:'途中'},
 {g:'画像作成フロー', t:'この案で作りますか？（まとめて作る）', h:'./flow_image_v3_wire.html#step=bulkcheck', w:1120, s:'途中'},
 {g:'画像作成フロー', t:'画像素材ルート（最初から）', h:'./flow_image_material_wire.html', w:1280},
 {g:'画像作成フロー', t:'チャットで構成と設定を決める', h:'./flow_image_material_wire.html#step=chat', w:1280, s:'途中'},
 {g:'画像作成フロー', t:'投稿を編集（画像）', h:'./post_editor_image_wire.html', w:1200},
 {g:'画像作成フロー', t:'確認依頼（画像）', h:'./post_editor_image_wire.html#approval-request', w:1200, s:'途中'},
 {g:'画像作成フロー', t:'確認待ち - 作成者視点（画像）', h:'./post_editor_image_wire.html#approval-waiting', w:1200, s:'途中'},
 {g:'画像作成フロー', t:'承認者確認中（画像）', h:'./post_editor_image_wire.html#approval-review', w:1200, s:'途中'},
 {g:'画像作成フロー', t:'画像エディタ', h:'./image_editor_dark_wire.html', w:1440},
 {g:'手動作成フロー', t:'手動作成（完成品から作る）', h:'./flow_manual_wire.html', w:1120}
];
var visible=[], cur=-1, device='pc', zoom='fit';

function renderSide(){
  var q=(document.getElementById('vq').value||'').trim().toLowerCase();
  visible=SCREENS.filter(function(s){
    return !q || (s.g+' '+s.t+' '+s.h).toLowerCase().indexOf(q)>=0;
  });
  var side=document.getElementById('vSide');
  if(!visible.length){ side.innerHTML='<div class="vempty">見つかりませんでした</div>'; return; }
  var html='', lastG=null;
  visible.forEach(function(s,i){
    if(s.g!==lastG){ html+=(lastG?'</div>':'')+'<div class="vgroup"><div class="vgname">'+s.g+'</div>'; lastG=s.g; }
    html+='<div class="vitem'+(SCREENS.indexOf(s)===cur?' on':'')+'" data-i="'+i+'">'+
      '<span class="vt">'+s.t+'</span>'+(s.s?'<span class="vstep">'+s.s+'</span>':'')+'</div>';
  });
  side.innerHTML=html+'</div>';
}
function show(idx){
  var s=SCREENS[idx]; if(!s)return;
  cur=idx;
  document.getElementById('vFrame').dataset.w=(device==='sp')?390:s.w;
  document.getElementById('vIframe').src=s.h;
  document.getElementById('vOpen').href=s.h;
  document.title='画面ビューア｜'+s.t;
  location.hash=encodeURIComponent(s.h);
  applyZoom();
  renderSide();
  var on=document.querySelector('.vitem.on'); if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest'});
}
function applyZoom(){
  var fr=document.getElementById('vFrame'), fit=document.getElementById('vFit'),
      ifr=document.getElementById('vIframe'), stage=document.getElementById('vStage');
  var w=parseInt(fr.dataset.w,10)||1200;
  var availW=stage.clientWidth-44, availH=stage.clientHeight-44;
  var k=1, h;
  if(device==='sp'){
    h=844;
    if(zoom==='fit')k=Math.min(1, availW/w, availH/h);
  }else{
    /* 幅に合わせて縮小し、高さはビューアの残りいっぱいまで使う */
    if(zoom==='fit')k=Math.min(1, availW/w);
    h=Math.max(600, Math.round(availH/k));
  }
  ifr.style.width=w+'px'; ifr.style.height=h+'px';
  fr.style.width=w+'px'; fr.style.height=h+'px';
  fr.style.transform='scale('+k+')';
  /* 縮小後の見た目のサイズをレイアウトにも反映（右側が切れないように） */
  fit.style.width=Math.round(w*k)+'px';
  fit.style.height=Math.round(h*k)+'px';
}
function move(d){
  if(!visible.length)return;
  var pos=visible.indexOf(SCREENS[cur]);
  if(pos<0)pos=0; else pos=Math.max(0,Math.min(visible.length-1,pos+d));
  show(SCREENS.indexOf(visible[pos]));
}
document.getElementById('vSide').addEventListener('click',function(e){
  var row=e.target.closest('.vitem'); if(!row)return;
  show(SCREENS.indexOf(visible[+row.dataset.i]));
});
document.getElementById('vq').addEventListener('input',renderSide);
document.getElementById('vq').addEventListener('keydown',function(e){
  if(e.key==='ArrowDown'){e.preventDefault();move(1);}
  else if(e.key==='ArrowUp'){e.preventDefault();move(-1);}
  else if(e.key==='Enter'){e.preventDefault(); if(visible.length)show(SCREENS.indexOf(visible[0]));}
  else if(e.key==='Escape'){this.value='';renderSide();this.blur();}
});
document.addEventListener('keydown',function(e){
  var typing=/^(INPUT|TEXTAREA)$/.test((e.target.tagName||''));
  if(e.key==='/'&&!typing){e.preventDefault();document.getElementById('vq').focus();return;}
  if(typing)return;
  if(e.key==='ArrowDown'||e.key==='j'){e.preventDefault();move(1);}
  else if(e.key==='ArrowUp'||e.key==='k'){e.preventDefault();move(-1);}
});
document.getElementById('vDevice').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b)return;
  this.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});
  b.classList.add('on'); device=b.dataset.d; show(cur);
});
document.getElementById('vZoom').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b)return;
  this.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});
  b.classList.add('on'); zoom=b.dataset.z; applyZoom();
});
window.addEventListener('resize',applyZoom);

/* プレビュー枠の中でワイヤー間のリンクを押したときの逃がし先。

   枠の幅は「いま選んでいる画面」の w（SCREENS の値）で固定されていて、フィット時は
   さらに transform: scale() で縮んでいる。その中で別の画面へ遷移すると、遷移先が
   自分の想定幅ではなく前の画面の幅で描かれるので、横幅が足りず本当の大きさで見えない。
   枠の中の遷移はすべて新しいタブへ逃がして、実寸のブラウザ幅で開かせる。

   ページ内アンカー（#…）は枠の中で完結するのでそのまま。
   target 指定済み（ヘルプセンターなど）は元の指定に任せる。

   実装は window.open ではなく「リンクに target を付ける」。window.open はユーザー操作の
   文脈から外れるとポップアップブロックの対象になるが、target 付きリンクの通常遷移は
   ブロックされない。読み込み時に一括で付け、あとから JS が足したリンクのために
   クリックのキャプチャ段階（既定の遷移が走る前）でも同じ判定を通す。 */
(function(){
  function toNewTab(a){
    if(!a) return;
    var h=a.getAttribute('href');
    if(!h||h.charAt(0)==='#') return;   /* ページ内アンカーは枠の中で完結する */
    if(a.target) return;                /* 既に指定があるものは元の指定に任せる */
    a.target='_blank';
    a.rel='noopener';
  }
  document.getElementById('vIframe').addEventListener('load',function(){
    var doc;
    try{ doc=this.contentDocument; }catch(err){ return; }  /* 別オリジンなら触れない */
    if(!doc) return;
    doc.querySelectorAll('a[href]').forEach(toNewTab);
    doc.addEventListener('click',function(e){
      toNewTab(e.target&&e.target.closest?e.target.closest('a[href]'):null);
    },true);
  });
})();

/* 起動時：ハッシュがあればその画面、なければ先頭 */
(function(){
  renderSide();
  var want=decodeURIComponent((location.hash||'').replace('#',''));
  var idx=SCREENS.findIndex(function(s){return s.h===want;});
  show(idx>=0?idx:0);
})();
</script>
</body></html>
